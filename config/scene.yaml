# Модель сцены AD5M: состояние принтера, а не самой печати.
# На ней строятся проверки «нет пластины PEI», «пластина лежит криво»,
# «голова не двигается / ведёт себя не так», «в камере рука».
#
# Учится только на кадрах AD5M: камера и ракурс у всех AD5M одинаковые,
# и только на этих кадрах стол и голова размечены всегда.
#
# Порядок names задаёт id класса: после первой обученной модели не переставлять,
# новые добавлять только в конец.
names:
  - pei_plate          # пластина PEI на столе; её отсутствие при печати = тревога
  - printer_head       # печатающая голова; по её рамке во времени — контроль движения
  - pei_misplaced      # пластина лежит неровно (угол съехал)
  - test_line          # тестовая линия филамента в начале печати
  - hand               # рука в камере — тревоги в этот момент не слать
  - head_no_cover      # слетела крышка обдува — разметки пока нет, класс под новую
  - glass_plate        # на столе стекло (или другая пластина) вместо PEI — «нет покрытия PEI»

only_own: true

roboflow_map:
  PEI_PLATE: pei_plate
  PRINTER_HEAD: printer_head
  __ER_PEI_SET: pei_misplaced
  TEST_FILAMENT_LINE: test_line
  __ER_PEOPLE_HAND: hand
  __ER_SPAGHETTI: null
  __ER_STRINGING: null
  __ER_WEB: null
  __ER_WARPING: null
  __ER_CRACKS: null
  __ER_GARBAGE: null
  # Новая разметка (extract_frames.py) ведётся сразу в классах обеих моделей:
  # свои классы переходят сами в себя, классы брака отбрасываются.
  spaghetti: null
  stringing: null
  warping: null
  cracks: null
  garbage: null
  detached: null
