# Приёмочный тест модели брака (benchmark.py): целые записанные печати через ту же логику
# тревог, что у сервиса. Цифры — то, что важно продукту, а не mAP по рамкам.

every_s: 10          # кадр раз в столько секунд (сервис опрашивает раз в 5–10 с)
grace_s: 180         # остановка засчитывается, если случилась не позже чем через столько после конца окна сбоя

criteria:
  max_false_stops_per_10h: 0.5   # не больше 1 ложной остановки на 20 часов печати
  min_detection_rate: 0.9        # доля пойманных сбоев
  max_time_to_detect_s: 180      # среднее время от начала сбоя до остановки

# Известные сбои: окна, когда остановка ОЖИДАЕТСЯ. Остановка из-за брака вне окон — ложная.
# «train» — печать была в обучении (оценка оптимистична), «holdout» — отложенная печать.
failures:
  - {session: "20250304_2057", start: "2025-03-04 20:57:00", end: "2025-03-04 21:02:00", kind: spaghetti,
     set: holdout, note: "гнездо чёрной нити на столе (остаток сорванной печати)"}
  - {session: "20250305_1817", start: "2025-03-05 19:13:00", end: "2025-03-05 19:17:30", kind: spaghetti,
     set: holdout, note: "комок выдавленного пластика на столе"}
  - {session: "20250301_2055", start: "2025-03-01 20:55:30", end: "2025-03-01 20:59:00", kind: spaghetti,
     set: train, note: "ком разноцветной нити на столе"}
  - {session: "20250301_2202", start: "2025-03-01 22:02:30", end: "2025-03-01 22:03:30", kind: spaghetti,
     set: train, note: "ком нити у задней стенки"}
  - {session: "20250218_1542", start: "2025-02-18 18:20:00", end: "2025-02-18 20:05:00", kind: warping,
     set: train, note: "дефектная полоса на стенке конуса"}
